[package]
name = "subbier-macos"
description = "subbier macOS menu bar app (LSUIElement, no dock icon, no main window)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
# NOT "Subbier": macOS volumes are case-insensitive, so `Subbier` and the CLI's
# `subbier` are ONE file in target/ and each build replaced the other. The .app
# still presents as "Subbier" — bundle.sh copies this binary under that name.
name = "subbier-menubar"
path = "src/main.rs"

[dependencies]
libsubby = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
dirs = { workspace = true }
image = { workspace = true }
tray-icon = { workspace = true }
muda = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
dispatch2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
jiff = { workspace = true }
