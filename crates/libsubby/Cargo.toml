[package]
name = "libsubby"
description = "Core library for subbier: subscription usage monitoring and a load-balancing proxy for Codex and Claude."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# HARD RULE: this crate has zero UI dependencies. No tray-icon, no muda, no
# objc2, no clap. Everything here must be Send + Sync and usable from a Waybar
# script, an Omarchy QML plugin shim, a CLI, or a macOS menu bar.

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
kdl = { workspace = true }
jiff = { workspace = true }
rusqlite = { workspace = true }

thiserror = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
