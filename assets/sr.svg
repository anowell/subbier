<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!--
    subbier — the "sR" monogram (".rs" read backwards).

    TEMPLATE IMAGE: black + alpha only. macOS re-tints and auto-inverts this for
    the light/dark menu bar, so any colour here would be discarded. Severity
    (ok/warn/critical) is carried by the text title next to the icon, never here.
    See assets/README.md.

    Everything is laid out on an 18-unit grid == 18 device pixels at 1x, so every
    stem edge lands on a whole pixel and the mark stays crisp in the menu bar.
    18 -> 36 -> 54 are exact integer multiples, so 2x and 3x stay pixel-aligned
    too. Do not render this at a size that is not a multiple of 18.
      stroke weight  2      (stems fill exactly 2 px columns)
      baseline       y=15
      cap height     y=3..15   (R, 12 units)
      x-height       y=5..15   (s, 10 units)
      counters       2 units, on whole-pixel rows (7..9 and 11..13)
      R  x=9..17,  s  x=1..8,  1-unit sidebearings
    Only the R's leg is a diagonal; keep it that way. If you move anything, move
    it by whole units and re-check the proof sheet in README.md.
  -->

  <!-- R: stem -->
  <rect x="9" y="3" width="2" height="12"/>

  <!-- R: bowl (outer D, inner counter knocked out via evenodd) -->
  <path fill-rule="evenodd" d="
    M9 3 H14.7 A2.3 2.3 0 0 1 17 5.3 V7.7 A2.3 2.3 0 0 1 14.7 10 H9 Z
    M11 5 V8 H14 A1 1 0 0 0 15 7 V6 A1 1 0 0 0 14 5 Z"/>

  <!-- R: leg — springs from the stem at the bowl junction, cut flat on the
       baseline. Horizontal width 2.828 == 2 units measured perpendicular. -->
  <path d="M11 9 L13.828 9 L17 15 L14.172 15 Z"/>

  <!-- s: single stroked centreline, round joins. Bars at y=6/10/14, verticals
       at x=2 (upper left) and x=7 (lower right). -->
  <path fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"
        d="M7.6 6 H3.5 Q2 6 2 7.5 V8.5 Q2 10 3.5 10 H5.5 Q7 10 7 11.5 V12.5 Q7 14 5.5 14 H1.4"/>
</svg>
